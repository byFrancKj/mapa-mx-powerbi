<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Mapa México (INEGI)</title>
<style>
body { margin: 0; padding: 16px; background: #f3f2f1; color: #252423; font: 13px "Segoe UI", helvetica, arial, sans-serif; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.barra button { padding: 5px 10px; border: 1px solid #c8c6c4; border-radius: 4px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
.barra button[aria-pressed="true"] { border-color: #252423; background: #252423; color: #fff; }
.barra select { padding: 4px; font: inherit; }
.ayuda { margin: 0 0 12px; color: #605e5c; }
.visual { background: #fff; box-shadow: 0 0 0 1px #e1dfdd; }
.globo { position: fixed; z-index: 9; display: none; padding: 6px 8px; border: 1px solid #c8c6c4; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); font-size: 12px; pointer-events: none; }
.globo div { display: flex; justify-content: space-between; gap: 12px; }
.globo span { color: #605e5c; }
/*CSS*/
</style>
</head>

</body>
