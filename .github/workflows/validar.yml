name: Validar

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coherencia de configuración, catálogos y geometrías
        run: python scripts/validar.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Las especificaciones de Deneb compilan y se dibujan
        run: |
          python scripts/modelo_referencia.py
          npm run vistas
