name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  datos:
    name: Sin datos privados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/revisar_datos.py

  catalogos:
    name: Catálogos, geometría y ejemplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/validar.py
      - run: pip install -r requirements.txt
      - run: python scripts/modelo_referencia.py
      - name: Los valores esperados versionados están al día
        run: git diff --exit-code -- ejemplo/valores_esperados.csv

  visual:
    name: Visual
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visual/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run tipos
      - run: npm test
      - name: El visual no pide acceso a internet
        run: node scripts/sin_red.mjs
      - run: npx pbiviz package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-pbiviz
          path: visual/dist/*.pbiviz
          if-no-files-found: error
